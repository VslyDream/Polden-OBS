<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
  <title id="title">От записи до папки команды</title>
  <desc id="desc">Выберите игру и режим, снимите дубль с маркерами, дождитесь подготовки MP4, получите видео и TXT в папке проекта. Схема режима MP4 → Lucid.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#83d9b0"/></marker></defs>
  <rect width="1200" height="290" rx="20" fill="#171a22"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="36" y="43" fill="#9cabbc" font-size="15" letter-spacing="2">POLDEN OBS · MP4 → LUCID</text>
    <g fill="#272d3b" stroke="#3d485e"><rect x="36" y="74" width="246" height="124" rx="12"/><rect x="330" y="74" width="246" height="124" rx="12"/><rect x="624" y="74" width="246" height="124" rx="12"/><rect x="918" y="74" width="246" height="124" rx="12"/></g>
    <g stroke="#83d9b0" stroke-width="2" marker-end="url(#arrow)"><path d="M291 136H318"/><path d="M585 136H612"/><path d="M879 136H906"/></g>
    <g fill="#83d9b0" font-size="16" font-weight="600"><text x="54" y="103">01</text><text x="348" y="103">02</text><text x="642" y="103">03</text><text x="936" y="103">04</text></g>
    <g fill="#fff" font-size="23" font-weight="600"><text x="54" y="139">Выбрать игру</text><text x="348" y="139">Снять дубль</text><text x="642" y="139">Подготовить MP4</text><text x="936" y="139">Передать команде</text></g>
    <g fill="#b2bfd0" font-size="16"><text x="54" y="171">Папка + окно + режим</text><text x="348" y="171">Маркеры на лету</text><text x="642" y="171">Без перекодирования</text><text x="936" y="171">Видео + TXT на LucidLink</text></g>
    <text x="36" y="249" fill="#b2bfd0" font-size="17">Исходное имя сохраняется. После остановки дождитесь завершения обработки в карточке дубля.</text>
  </g>
</svg>
