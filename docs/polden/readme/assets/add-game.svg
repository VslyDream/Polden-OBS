<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title">
  <title id="title">Окно Add game. Пример настройки папки и захвата игры</title>
  <style>text{font:18px 'Segoe UI',Arial,sans-serif;fill:#f4f5f8}.title{font-weight:600}.muted{fill:#b8beca}.button{fill:#3c404b}.field{fill:#1d1f26;stroke:#444955}</style>
  <rect width="760" height="360" rx="7" fill="#272a33"/>
  <rect width="760" height="40" rx="6" fill="#191b21"/>
  <text x="16" y="27" class="title">Add game</text>
  <text x="18" y="80">Game folder on LucidLink</text>
  <rect x="235" y="55" width="397" height="36" rx="4" class="field"/>
  <text x="248" y="80">L:\Demo</text>
  <rect x="640" y="55" width="102" height="36" rx="4" class="button"/><text x="691" y="80" text-anchor="middle">Browse…</text>
  <text x="18" y="128">Game name</text>
  <rect x="235" y="103" width="507" height="36" rx="4" class="field"/>
  <text x="248" y="128">Demo</text>
  <text x="18" y="176">Video folder</text>
  <rect x="235" y="151" width="452" height="36" rx="4" class="field"/>
  <text x="248" y="176">L:\Demo\02_Assets\01_VIDEO</text>
  <rect x="695" y="151" width="47" height="36" rx="4" class="button"/><text x="718" y="176" text-anchor="middle">↻</text>
  <text x="18" y="224">Game window</text>
  <rect x="235" y="199" width="507" height="36" rx="4" class="field"/>
  <text x="248" y="224">Demo / Demo.exe</text>
  <path d="m718 216 10 0 -5 6z" fill="#bcc0c9"/>
  <text x="18" y="272">Source</text>
  <text x="248" y="272">Game Capture · Game Capture</text>
  <rect x="528" y="309" width="111" height="36" rx="4" class="button"/><text x="583" y="333" text-anchor="middle">Add game</text>
  <rect x="648" y="309" width="94" height="36" rx="4" class="button"/><text x="695" y="333" text-anchor="middle">Cancel</text>
</svg>
