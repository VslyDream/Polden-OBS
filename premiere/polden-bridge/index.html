<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 16px; color: #eee; font: 13px system-ui; }
    label { display: block; margin-bottom: 8px; }
    input { box-sizing: border-box; width: 100%; margin: 5px 0 10px; padding: 6px; }
    button { padding: 6px 12px; }
    #status { margin-top: 14px; line-height: 1.5; white-space: pre-wrap; }
  </style>
</head>
<body>
  <label for="bridgeKey">Ключ из настроек Polden OBS</label>
  <input id="bridgeKey" type="password" autocomplete="off">
  <button id="connect">Подключить</button>
  <div id="status">Ожидание подключения.</div>
  <script src="index.js"></script>
</body>
</html>
